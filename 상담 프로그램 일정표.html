<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재원생·학부모 상담 프로그램 일정표</title>
  
  <!-- Tailwind CSS 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 및 ReactDOM 로드 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- JSX 컴파일을 위한 Babel 로드 -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
  <!-- 리액트 앱이 렌더링될 영역 -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // 원본 데이터를 기반으로 한 일정 배열
    const SCHEDULE_DATA = [
      { date: '2026-08-04', time: '14:00', prof: '문지혜' },
      { date: '2026-08-04', time: '14:00', prof: '이임숙' },
      { date: '2026-08-04', time: '15:30', prof: '문지혜' },
      { date: '2026-08-04', time: '15:30', prof: '이임숙' },
      { date: '2026-08-04', time: '17:00', prof: '문지혜' },
      { date: '2026-08-04', time: '17:00', prof: '이임숙' },
      { date: '2026-08-05', time: '14:00', prof: '문지혜' },
      { date: '2026-08-05', time: '14:00', prof: '이임숙' },
      { date: '2026-08-05', time: '15:30', prof: '문지혜' },
      { date: '2026-08-05', time: '15:30', prof: '이임숙' },
      { date: '2026-08-05', time: '17:00', prof: '문지혜' },
      { date: '2026-08-05', time: '17:00', prof: '이임숙' },
      { date: '2026-09-04', time: '13:00', prof: '하수경' },
      { date: '2026-09-04', time: '15:00', prof: '하수경' },
      { date: '2026-09-10', time: '11:00', prof: '이연주' },
      { date: '2026-09-10', time: '14:00', prof: '이연주' },
      { date: '2026-09-10', time: '15:30', prof: '이연주' },
      { date: '2026-09-11', time: '13:00', prof: '하수경' },
      { date: '2026-09-11', time: '15:00', prof: '하수경' },
      { date: '2026-09-17', time: '11:00', prof: '이연주' },
      { date: '2026-09-17', time: '14:00', prof: '이연주' },
      { date: '2026-09-17', time: '15:30', prof: '이연주' },
      { date: '2026-09-18', time: '11:00', prof: '하수경' },
      { date: '2026-09-18', time: '13:00', prof: '하수경' },
    ];

    const PROFESSORS = ['전체', '문지혜', '이임숙', '하수경', '이연주'];
    const MONTHS = [8, 9];
    const DAYS_OF_WEEK = ['일', '월', '화', '수', '목', '금', '토'];

    const PROF_COLORS = {
      '문지혜': 'bg-blue-50 text-blue-700 border-blue-200',
      '이임숙': 'bg-emerald-50 text-emerald-700 border-emerald-200',
      '하수경': 'bg-purple-50 text-purple-700 border-purple-200',
      '이연주': 'bg-orange-50 text-orange-700 border-orange-200',
    };

    const getCalendarDays = (year, month) => {
      const firstDayIndex = new Date(year, month - 1, 1).getDay();
      const daysInMonth = new Date(year, month, 0).getDate();
      
      const days = [];
      for (let i = 0; i < firstDayIndex; i++) {
        days.push(null);
      }
      for (let i = 1; i <= daysInMonth; i++) {
        const dateString = `${year}-${String(month).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        days.push({ day: i, dateString });
      }
      return days;
    };

    function ScheduleCalendar() {
      const [currentMonth, setCurrentMonth] = useState(8);
      const [selectedProf, setSelectedProf] = useState('전체');

      const calendarDays = useMemo(() => getCalendarDays(2026, currentMonth), [currentMonth]);

      const filteredEvents = useMemo(() => {
        return SCHEDULE_DATA.filter(event => {
          const isCorrectMonth = parseInt(event.date.split('-')[1], 10) === currentMonth;
          const isCorrectProf = selectedProf === '전체' || event.prof === selectedProf;
          return isCorrectMonth && isCorrectProf;
        });
      }, [currentMonth, selectedProf]);

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-8 min-h-screen font-sans">
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            
            <div className="p-6 border-b border-gray-100 bg-white">
              <h2 className="text-2xl font-bold text-gray-800 mb-6 text-center md:text-left">
                🗓️ 재원생·학부모 상담 프로그램 일정표
              </h2>
              
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div className="flex bg-gray-100 p-1 rounded-lg self-start">
                  {MONTHS.map(month => (
                    <button
                      key={month}
                      onClick={() => setCurrentMonth(month)}
                      className={`px-6 py-2 rounded-md font-medium text-sm transition-all ${
                        currentMonth === month
                          ? 'bg-white text-gray-900 shadow-sm'
                          : 'text-gray-500 hover:text-gray-700'
                      }`}
                    >
                      {month}월
                    </button>
                  ))}
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-sm font-semibold text-gray-500 mr-1">필터:</span>
                  {PROFESSORS.map(prof => (
                    <button
                      key={prof}
                      onClick={() => setSelectedProf(prof)}
                      className={`px-3 py-1.5 rounded-full text-xs font-medium border transition-all ${
                        selectedProf === prof
                          ? 'bg-gray-800 text-white border-gray-800'
                          : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'
                      }`}
                    >
                      {prof}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="p-4 md:p-6 bg-white">
              <div className="grid grid-cols-7 gap-px bg-gray-200 border border-gray-200 rounded-xl overflow-hidden">
                {DAYS_OF_WEEK.map((day, idx) => (
                  <div 
                    key={day} 
                    className={`bg-gray-50 py-3 text-center text-sm font-bold ${
                      idx === 0 ? 'text-red-500' : idx === 6 ? 'text-blue-500' : 'text-gray-600'
                    }`}
                  >
                    {day}
                  </div>
                ))}

                {calendarDays.map((dateObj, index) => {
                  if (!dateObj) {
                    return <div key={`empty-${index}`} className="bg-white min-h-[120px]"></div>;
                  }

                  const { day, dateString } = dateObj;
                  const dayEvents = filteredEvents.filter(e => e.date === dateString);
                  const dayOfWeek = index % 7;
                  const isSunday = dayOfWeek === 0;
                  const isSaturday = dayOfWeek === 6;

                  return (
                    <div 
                      key={dateString} 
                      className="bg-white min-h-[120px] p-2 flex flex-col transition-colors hover:bg-gray-50"
                    >
                      <span className={`text-sm font-semibold mb-2 ${
                        isSunday ? 'text-red-500' : isSaturday ? 'text-blue-500' : 'text-gray-700'
                      }`}>
                        {day}
                      </span>
                      
                      <div className="flex flex-col gap-1.5 overflow-y-auto">
                        {dayEvents.map((event, i) => (
                          <div 
                            key={i} 
                            className={`text-xs px-2 py-1.5 rounded border flex justify-between items-center ${PROF_COLORS[event.prof] || 'bg-gray-100 border-gray-200 text-gray-800'}`}
                          >
                            <span className="font-bold">{event.time}</span>
                            <span className="truncate ml-1">{event.prof}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ScheduleCalendar />);
  </script>
</body>
</html>

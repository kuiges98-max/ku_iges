<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027학년도 과학영재교육원 모집현황 대시보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (CSV 파싱용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels Plugin (그래프 위에 값 표시) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-8">
        <!-- 상단 헤더 -->
        <header class="text-center py-6">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">2027학년도 과학영재교육원 모집현황 대시보드</h1>
            <p class="text-gray-500" id="updateStatus">구글 스프레드시트에서 실시간 데이터를 불러오는 중입니다...</p>
        </header>

        <!-- 결과 대시보드 -->
        <div id="dashboardArea" class="hidden space-y-8">
            <!-- TOP 3 요약 위젯 -->
            <section>
                <h2 class="text-2xl font-bold text-gray-800 mb-4">🔥 가장 치열한 모집과정 TOP 3</h2>
                <div id="top3Container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- JS로 동적 생성됨 -->
                </div>
            </section>

            <!-- 차트 영역 -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
                <h2 class="text-xl font-bold text-gray-800 mb-4">📊 일자별 누적 지원자 수 그래프</h2>
                <div class="relative w-full h-96 flex-grow">
                    <canvas id="rateChart"></canvas>
                </div>
            </section>

            <!-- 데이터 테이블 영역 -->
            <section class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800">📋 과정별·일자별 상세 데이터</h2>
                    <span id="totalApplicants" class="px-3 py-1 bg-indigo-100 text-indigo-800 text-sm font-semibold rounded-full">총 지원자: 0명</span>
                </div>
                <div class="overflow-x-auto h-96 overflow-y-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50 sticky top-0" style="z-index: 10;">
                            <tr id="tableHeadRow">
                                <!-- JS로 동적 생성됨 -->
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                            <!-- JS로 동적 생성됨 -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script>
        // DataLabels 플러그인 등록
        Chart.register(ChartDataLabels);

        // ==========================================
        const TARGET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTvGdRxpB7aYvs5UYtqgp0wVv6bTuMaD0Mz4-u-u17Vm1oy7vHSkQ-slSA8UeUgZs8BSjLlKQOMeRxM/pub?output=csv"; 
        const CORS_PROXY = "https://api.allorigins.win/raw?url=";
        // ==========================================

        const dashboardArea = document.getElementById('dashboardArea');
        const top3Container = document.getElementById('top3Container');
        const tableHeadRow = document.getElementById('tableHeadRow');
        const tableBody = document.getElementById('tableBody');
        const totalApplicantsEl = document.getElementById('totalApplicants');
        const updateStatus = document.getElementById('updateStatus');
        let chartInstance = null;

        const courseCapacities = {
            "초등심화 수학": 20,
            "초등심화 과학": 30,
            "초등심화 AI·융합과학": 15,
            "중등심화 수학": 20,
            "중등심화 과학": 30,
            "중등심화 AI·융합과학": 15,
            "초등사사": 15,
            "중등사사": 5
        };

        window.addEventListener('DOMContentLoaded', () => {
            fetchSheetData();
        });

        async function fetchSheetData() {
            try {
                // 프록시를 통해 요청 (캐시 방지 토큰 추가)
                const fetchUrl = CORS_PROXY + encodeURIComponent(TARGET_URL + '&t=' + new Date().getTime());
                const response = await fetch(fetchUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const csvText = await response.text();
                
                const workbook = XLSX.read(csvText, { type: 'string' });
                const firstSheetName = workbook.SheetNames[0];
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);
                
                processData(jsonData);
                
                const now = new Date();
                const timeString = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
                updateStatus.innerHTML = `<span class='text-blue-600 font-medium'>최종 업데이트: ${timeString}</span> (구글 시트 연동 완료)`;
            } catch (error) {
                updateStatus.innerHTML = "<span class='text-red-500 font-bold'>⚠️ 데이터를 불러오는 데 실패했습니다. 다시 시도해주세요.</span>";
                console.error("데이터 로딩 에러:", error);
            }
        }

        function processData(data) {
            const dates = new Set();
            const courseStats = {};

            for (const [name, capacity] of Object.entries(courseCapacities)) {
                courseStats[name] = { capacity: capacity, total: 0, byDate: {} };
            }

            data.forEach(row => {
                let courseName = row['모집과정'] ? row['모집과정'].toString().trim() : '';
                let rawDate = row['지원일자'] ? row['지원일자'].toString().trim() : '';
                
                if (courseName && courseStats[courseName]) {
                    let dateStr = rawDate || '날짜 미상';
                    if(rawDate.length === 8) {
                        dateStr = rawDate.substring(4,6) + '/' + rawDate.substring(6,8);
                    }
                    
                    dates.add(dateStr);
                    courseStats[courseName].total++;
                    courseStats[courseName].byDate[dateStr] = (courseStats[courseName].byDate[dateStr] || 0) + 1;
                }
            });

            const uniqueDates = Array.from(dates).sort();
            
            let processedData = [];
            let totalApplicants = 0;

            for (const [name, stats] of Object.entries(courseStats)) {
                totalApplicants += stats.total;
                let rate = stats.capacity > 0 ? (stats.total / stats.capacity).toFixed(2) : 0;
                processedData.push({
                    name: name,
                    capacity: stats.capacity,
                    total: stats.total,
                    rate: parseFloat(rate),
                    byDate: stats.byDate
                });
            }

            processedData.sort((a, b) => b.rate - a.rate);

            totalApplicantsEl.innerText = `총 지원자: ${totalApplicants.toLocaleString()}명`;

            dashboardArea.classList.remove('hidden');
            renderTop3(processedData);
            renderTable(processedData, uniqueDates);
            renderChart(processedData, uniqueDates);
        }

        function renderTop3(data) {
            top3Container.innerHTML = '';
            const top3 = data.slice(0, 3);
            const medals = ['🥇', '🥈', '🥉'];
            const colors = ['bg-blue-50 border-blue-200', 'bg-gray-50 border-gray-200', 'bg-orange-50 border-orange-200'];
            
            top3.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `p-6 rounded-xl border ${colors[index] || 'bg-white border-gray-100'} shadow-sm flex flex-col justify-center`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="text-sm font-medium text-gray-500">${medals[index]} 경쟁률 ${index + 1}위</div>
                    </div>
                    <div class="text-lg font-bold text-gray-900 mb-2 leading-tight">${item.name}</div>
                    <div class="flex justify-between items-end mt-auto">
                        <div class="text-xs text-gray-500">모집 ${item.capacity} / 지원 ${item.total}</div>
                        <div class="text-3xl font-black text-indigo-600">${item.rate}:1</div>
                    </div>
                `;
                top3Container.appendChild(card);
            });
        }

        function renderTable(data, uniqueDates) {
            let dateHeaders = uniqueDates.map(date => 
                `<th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">${date} 지원</th>`
            ).join('');

            tableHeadRow.innerHTML = `
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">모집과정</th>
                <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">모집인원</th>
                ${dateHeaders}
                <th class="px-4 py-3 text-right text-xs font-bold text-gray-700 uppercase tracking-wider bg-gray-100 border-l border-gray-200">총 지원자</th>
                <th class="px-4 py-3 text-right text-xs font-bold text-gray-700 uppercase tracking-wider bg-gray-100">경쟁률</th>
            `;

            tableBody.innerHTML = '';
            data.forEach(item => {
                const tr = document.createElement('tr');
                let dateCells = uniqueDates.map(date => 
                    `<td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500 text-right">${item.byDate[date] || 0}</td>`
                ).join('');

                tr.innerHTML = `
                    <td class="px-4 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${item.name}</td>
                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500 text-right">${item.capacity}</td>
                    ${dateCells}
                    <td class="px-4 py-4 whitespace-nowrap text-sm font-bold text-indigo-600 text-right bg-gray-50 border-l border-gray-100">${item.total}</td>
                    <td class="px-4 py-4 whitespace-nowrap text-sm font-black text-red-500 text-right bg-gray-50">${item.rate}:1</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function renderChart(data, uniqueDates) {
            const ctx = document.getElementById('rateChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const formatLabels = (name) => name.replace(' ', '\n');
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6'];
            
            const datasets = uniqueDates.map((date, i) => {
                return {
                    type: 'bar',
                    label: `${date} 지원자`,
                    data: data.map(d => d.byDate[date] || 0),
                    backgroundColor: colors[i % colors.length] + 'CC',
                    borderColor: colors[i % colors.length],
                    borderWidth: 1,
                    stack: 'Stack 0',
                    yAxisID: 'y',
                    datalabels: {
                        display: false
                    }
                };
            });

            // 누적 총 지원자 수를 가운데 정렬하여 표시하기 위해 투명한 선(Line) 그래프 데이터셋 추가
            // 막대(bar)로 추가하면 공간을 나누어 우측으로 밀리지만 선(line)은 중앙에 정확히 점을 찍습니다.
            datasets.push({
                type: 'line',
                label: '총 지원자 표기용',
                data: data.map(d => d.total),
                backgroundColor: 'transparent',
                borderColor: 'transparent',
                borderWidth: 0,
                pointRadius: 0, // 선의 점(원) 숨김
                pointHoverRadius: 0,
                showLine: false, // 선 자체를 숨김
                yAxisID: 'y',
                datalabels: {
                    display: true,
                    color: '#374151',
                    anchor: 'center',
                    align: 'top',
                    offset: 5, // 막대기 끝에서 약간 띄우기
                    font: {
                        weight: 'bold',
                        size: 13
                    },
                    formatter: function(value) {
                        return value + '명';
                    }
                }
            });

            chartInstance = new Chart(ctx, {
                data: { labels: data.map(d => formatLabels(d.name)), datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            top: 30 // 글자가 차트 밖으로 잘리지 않도록 여백
                        }
                    },
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { 
                            position: 'top',
                            labels: {
                                filter: function(item, chart) {
                                    return !item.text.includes('표기용');
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if(context.dataset.label.includes('표기용')) return null;
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    label += context.raw + '명';
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11 } } },
                        y: { 
                            stacked: true, 
                            position: 'left', 
                            title: { display: true, text: '누적 지원자 수 (명)', font: {weight: 'bold'} }, 
                            grid: { color: '#f3f4f6' },
                            grace: '15%'
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>

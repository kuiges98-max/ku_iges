<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027학년도 과학영재교육원 모집현황 대시보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (CSV 파싱용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels Plugin (그래프 위에 값 표시) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        .table-cell {
            border: 1px solid #e5e7eb;
            text-align: center;
            padding: 0.75rem 0.5rem;
            white-space: nowrap;
        }
        .header-cell {
            background-color: #f9fafb;
            font-weight: 600;
            color: #374151;
        }
        /* 통계 부분 짙은 회색 배경 적용 */
        .total-row {
            background-color: #e5e7eb; /* 짙은 회색 */
            font-weight: bold;
            color: #111827 !important; /* 항상 검은색 */
        }
        .total-row .table-cell {
            color: #111827 !important; /* 개별 셀도 덮어쓰기 */
        }
        /* 지원구분(모집과정) 열의 붉은 글씨 (계, 총계, 누계) */
        .total-row .row-label {
            color: #ef4444 !important; 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-8">
        <!-- 상단 헤더 -->
        <header class="text-center py-6">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">2027학년도 과학영재교육원 모집현황 대시보드</h1>
            <p class="text-gray-500" id="updateStatus">구글 스프레드시트에서 실시간 데이터를 불러오는 중입니다...</p>
        </header>

        <!-- 결과 대시보드 -->
        <div id="dashboardArea" class="hidden space-y-8">
            <!-- TOP 3 요약 위젯 -->
            <section>
                <h2 class="text-2xl font-bold text-gray-800 mb-4">🔥 가장 치열한 모집과정 TOP 3</h2>
                <div id="top3Container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- JS로 동적 생성됨 -->
                </div>
            </section>

            <!-- 차트 영역 -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
                <h2 class="text-xl font-bold text-gray-800 mb-4">📊 일자별 누적 지원자 수 그래프</h2>
                <div class="relative w-full h-96 flex-grow">
                    <canvas id="rateChart"></canvas>
                </div>
            </section>

            <!-- 데이터 테이블 영역 -->
            <section class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800">📋 과정별·일자별 상세 데이터</h2>
                    <div class="flex space-x-2">
                        <button onclick="sortTable('asc')" class="px-3 py-1 bg-white border border-gray-300 rounded text-sm hover:bg-gray-50">경쟁률 오름차순 ↑</button>
                        <button onclick="sortTable('desc')" class="px-3 py-1 bg-white border border-gray-300 rounded text-sm hover:bg-gray-50">경쟁률 내림차순 ↓</button>
                        <button onclick="renderTable()" class="px-3 py-1 bg-indigo-50 border border-indigo-200 text-indigo-700 rounded text-sm hover:bg-indigo-100">기본 정렬</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full border-collapse border border-gray-300" id="dataTable">
                        <thead>
                            <tr id="tableHeadRow">
                                <!-- JS로 동적 생성됨 -->
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- JS로 동적 생성됨 -->
                        </tbody>
                        <tfoot id="tableFoot">
                            <!-- JS로 동적 생성됨 -->
                        </tfoot>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script>
        // DataLabels 플러그인 등록
        Chart.register(ChartDataLabels);

        // ==========================================
        const TARGET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTvGdRxpB7aYvs5UYtqgp0wVv6bTuMaD0Mz4-u-u17Vm1oy7vHSkQ-slSA8UeUgZs8BSjLlKQOMeRxM/pub?output=csv"; 
        // ==========================================

        const dashboardArea = document.getElementById('dashboardArea');
        const top3Container = document.getElementById('top3Container');
        const tableHeadRow = document.getElementById('tableHeadRow');
        const tableBody = document.getElementById('tableBody');
        const tableFoot = document.getElementById('tableFoot');
        const updateStatus = document.getElementById('updateStatus');
        let chartInstance = null;
        
        let globalProcessedData = [];
        let globalUniqueDates = [];
        let defaultSortOrder = []; // 기본 정렬 순서 저장용

        // 표시할 5일간의 접수 날짜 고정 배열 (10/12 ~ 10/16)
        const fixedDates = ["10/12", "10/13", "10/14", "10/15", "10/16"];

        const courseCapacities = {
            "초등심화 수학": 20,
            "초등심화 과학": 30,
            "초등심화 AI·융합과학": 15,
            "초등사사": 15,
            "중등심화 수학": 20,
            "중등심화 과학": 30,
            "중등심화 AI·융합과학": 15,
            "중등사사": 5
        };

        window.addEventListener('DOMContentLoaded', () => {
            fetchSheetData();
        });

        async function fetchSheetData() {
            try {
                const fetchUrl = TARGET_URL + '&t=' + new Date().getTime();
                const response = await fetch(fetchUrl);
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const csvText = await response.text();
                const workbook = XLSX.read(csvText, { type: 'string' });
                const firstSheetName = workbook.SheetNames[0];
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);
                
                processData(jsonData);
                
                const now = new Date();
                const timeString = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
                updateStatus.innerHTML = `<span class='text-blue-600 font-medium'>최종 업데이트: ${timeString}</span> (구글 시트 연동 완료)`;
            } catch (error) {
                updateStatus.innerHTML = "<span class='text-red-500 font-bold'>⚠️ 데이터를 불러오는 데 실패했습니다. 다시 시도해주세요.</span>";
                console.error("데이터 로딩 에러:", error);
            }
        }

        function processData(data) {
            const courseStats = {};

            for (const [name, capacity] of Object.entries(courseCapacities)) {
                courseStats[name] = { capacity: capacity, total: 0, byDate: {} };
                fixedDates.forEach(d => courseStats[name].byDate[d] = 0);
            }

            data.forEach(row => {
                let courseName = row['모집과정'] ? row['모집과정'].toString().trim() : '';
                let rawDate = row['지원일자'] ? row['지원일자'].toString().trim() : '';
                
                if (courseName && courseStats[courseName]) {
                    let dateStr = rawDate || '날짜 미상';
                    if(rawDate.length === 8) {
                        dateStr = rawDate.substring(4,6) + '/' + rawDate.substring(6,8);
                    }
                    
                    courseStats[courseName].total++;
                    if(courseStats[courseName].byDate[dateStr] !== undefined) {
                        courseStats[courseName].byDate[dateStr]++;
                    }
                }
            });

            let processedData = [];
            for (const [name, stats] of Object.entries(courseStats)) {
                let rate = stats.capacity > 0 ? (stats.total / stats.capacity) : 0;
                processedData.push({
                    name: name,
                    capacity: stats.capacity,
                    total: stats.total,
                    rate: rate,
                    byDate: stats.byDate
                });
            }

            // 기본 정렬
            globalProcessedData = processedData;
            defaultSortOrder = [...processedData]; 
            globalUniqueDates = fixedDates;

            dashboardArea.classList.remove('hidden');
            
            // Top 3는 항상 경쟁률 내림차순 기준
            let top3Data = [...processedData].sort((a, b) => b.rate - a.rate);
            renderTop3(top3Data);
            
            renderTable(); 
            renderChart(processedData, globalUniqueDates); 
        }

        function renderTop3(data) {
            top3Container.innerHTML = '';
            const top3 = data.slice(0, 3);
            const medals = ['🥇', '🥈', '🥉'];
            const colors = ['bg-blue-50 border-blue-200', 'bg-gray-50 border-gray-200', 'bg-orange-50 border-orange-200'];
            
            top3.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `p-6 rounded-xl border ${colors[index] || 'bg-white border-gray-100'} shadow-sm flex flex-col justify-center`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="text-sm font-medium text-gray-500">${medals[index]} 경쟁률 ${index + 1}위</div>
                    </div>
                    <div class="text-lg font-bold text-gray-900 mb-2 leading-tight">${item.name}</div>
                    <div class="flex justify-between items-end mt-auto">
                        <div class="text-xs text-gray-500">모집 ${item.capacity} / 지원 ${item.total}</div>
                        <div class="text-3xl font-black text-indigo-600">${item.rate.toFixed(2)}:1</div>
                    </div>
                `;
                top3Container.appendChild(card);
            });
        }

        function sortTable(order) {
            if (order === 'asc') {
                globalProcessedData.sort((a, b) => a.rate - b.rate);
            } else if (order === 'desc') {
                globalProcessedData.sort((a, b) => b.rate - a.rate);
            }
            renderTable(order);
        }

        function renderTable(sortOrder = null) {
            const dataToRender = sortOrder ? globalProcessedData : defaultSortOrder;
            
            let dateHeaders = globalUniqueDates.map(date => 
                `<th class="table-cell header-cell">${date}일</th>`
            ).join('');

            tableHeadRow.innerHTML = `
                <th class="table-cell header-cell">모집과정</th>
                ${dateHeaders}
                <th class="table-cell header-cell border-l-2 bg-gray-50">모집정원</th>
                <th class="table-cell header-cell font-bold text-gray-900 bg-gray-50">지원자 수</th>
                <th class="table-cell header-cell bg-gray-50">경쟁률</th>
            `;

            tableBody.innerHTML = '';
            
            let elemTotal = { cap:0, tot:0, dates: { "10/12":0, "10/13":0, "10/14":0, "10/15":0, "10/16":0 } };
            let midTotal = { cap:0, tot:0, dates: { "10/12":0, "10/13":0, "10/14":0, "10/15":0, "10/16":0 } };
            let grandTotal = { cap:0, tot:0, dates: { "10/12":0, "10/13":0, "10/14":0, "10/15":0, "10/16":0 } };
            
            let cumulativeDates = { "10/12":0, "10/13":0, "10/14":0, "10/15":0, "10/16":0 };
            let currentCumulative = 0;

            const renderRow = (item, isGroupTotal = false, groupName = "") => {
                const tr = document.createElement('tr');
                if(isGroupTotal) tr.className = "total-row";

                let nameCell = isGroupTotal ? `<td class="table-cell row-label">${groupName}</td>` : `<td class="table-cell">${item.name}</td>`;
                
                let dateCells = globalUniqueDates.map(date => {
                    let val = isGroupTotal ? item.dates[date] : item.byDate[date];
                    let displayVal = val === 0 ? '-' : val;
                    // 값이 없을 때 '-' 표기 + 일반 항목은 회색 처리
                    let textColor = (val === 0 && !isGroupTotal) ? 'text-gray-400' : '';
                    return `<td class="table-cell ${textColor}">${displayVal}</td>`;
                }).join('');

                let cap = isGroupTotal ? item.cap : item.capacity;
                let tot = isGroupTotal ? item.tot : item.total;
                let rateVal = cap > 0 ? (tot / cap) : 0;
                let rate = rateVal.toFixed(2);
                
                // 총계 행은 무조건 검은색 적용 (isGroupTotal)
                let rateColorClass = "";
                if (!isGroupTotal) {
                    rateColorClass = rateVal >= 1.0 ? "text-blue-600" : "text-red-600";
                }

                let bgClass = isGroupTotal ? "" : "bg-gray-50";
                
                tr.innerHTML = `
                    ${nameCell}
                    ${dateCells}
                    <td class="table-cell border-l-2 ${bgClass}">${cap}</td>
                    <td class="table-cell font-bold text-gray-900 ${bgClass}">${tot === 0 ? '-' : tot}</td>
                    <td class="table-cell font-bold ${rateColorClass} ${bgClass}">${rate === "0.00" ? '-' : rate}</td>
                `;
                tableBody.appendChild(tr);
            };

            let elemItems = [];
            let midItems = [];

            // 정렬된 순서대로 초등/중등 분류
            dataToRender.forEach(item => {
                grandTotal.cap += item.capacity;
                grandTotal.tot += item.total;
                globalUniqueDates.forEach(d => {
                    grandTotal.dates[d] += item.byDate[d];
                });

                if(item.name.includes('초등')) {
                    elemItems.push(item);
                    elemTotal.cap += item.capacity;
                    elemTotal.tot += item.total;
                    globalUniqueDates.forEach(d => elemTotal.dates[d] += item.byDate[d]);
                } else {
                    midItems.push(item);
                    midTotal.cap += item.capacity;
                    midTotal.tot += item.total;
                    globalUniqueDates.forEach(d => midTotal.dates[d] += item.byDate[d]);
                }
            });

            // 누계 계산
            globalUniqueDates.forEach(d => {
                currentCumulative += grandTotal.dates[d];
                cumulativeDates[d] = currentCumulative;
            });

            // 렌더링
            if(sortOrder) {
                // 정렬이 활성화된 경우 전체 목록을 그냥 뿌림 (계 구분 생략)
                dataToRender.forEach(item => renderRow(item));
            } else {
                // 기본 정렬일 경우 초등계, 중등계 표시
                elemItems.forEach(item => renderRow(item));
                renderRow(elemTotal, true, "초등 계");
                
                midItems.forEach(item => renderRow(item));
                renderRow(midTotal, true, "중등 계");
            }

            // 하단 총계/누계
            tableFoot.innerHTML = '';
            
            // 빈 줄 추가 (여백)
            let emptyTr = document.createElement('tr');
            emptyTr.innerHTML = `<td colspan="${3 + globalUniqueDates.length}" class="border-0 p-2"></td>`;
            tableFoot.appendChild(emptyTr);

            // 총계 행 (총계는 color: #111827 적용됨)
            let trGrand = document.createElement('tr');
            trGrand.className = "total-row";
            let grandDateCells = globalUniqueDates.map(date => {
                let val = grandTotal.dates[date];
                return `<td class="table-cell">${val === 0 ? '-' : val}</td>`;
            }).join('');
            
            let grandRate = grandTotal.cap > 0 ? (grandTotal.tot / grandTotal.cap) : 0;
            
            trGrand.innerHTML = `
                <td class="table-cell row-label">총계</td>
                ${grandDateCells}
                <td class="table-cell border-l-2">${grandTotal.cap}</td>
                <td class="table-cell">${grandTotal.tot === 0 ? '-' : grandTotal.tot}</td>
                <td class="table-cell">${grandRate === 0 ? '-' : grandRate.toFixed(2)}</td>
            `;
            tableFoot.appendChild(trGrand);

            // 누계 행
            let trCumul = document.createElement('tr');
            trCumul.className = "total-row";
            let cumulDateCells = globalUniqueDates.map(date => {
                let val = cumulativeDates[date];
                return `<td class="table-cell">${val === 0 ? '-' : val}</td>`;
            }).join('');
            trCumul.innerHTML = `
                <td class="table-cell row-label">누계</td>
                ${cumulDateCells}
                <td colspan="3" class="table-cell border-l-2 border-r border-b"></td>
            `;
            tableFoot.appendChild(trCumul);
        }

        function renderChart(data, uniqueDates) {
            const ctx = document.getElementById('rateChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const formatLabels = (name) => name.replace(' ', '\n');
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
            
            const datasets = uniqueDates.map((date, i) => {
                return {
                    type: 'bar',
                    label: `${date} 지원자`,
                    data: data.map(d => d.byDate[date] || 0),
                    backgroundColor: colors[i % colors.length] + 'CC',
                    borderColor: colors[i % colors.length],
                    borderWidth: 1,
                    stack: 'Stack 0',
                    yAxisID: 'y',
                    datalabels: { display: false }
                };
            });

            datasets.push({
                type: 'line',
                label: '총 지원자 표기용',
                data: data.map(d => d.total),
                backgroundColor: 'transparent',
                borderColor: 'transparent',
                borderWidth: 0,
                pointRadius: 0,
                pointHoverRadius: 0,
                showLine: false,
                yAxisID: 'y',
                datalabels: {
                    display: true,
                    color: '#374151',
                    anchor: 'center',
                    align: 'top',
                    offset: 5,
                    font: { weight: 'bold', size: 13 },
                    formatter: function(value) { return value > 0 ? value + '명' : ''; }
                }
            });

            chartInstance = new Chart(ctx, {
                data: { labels: data.map(d => formatLabels(d.name)), datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { top: 30 } },
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { 
                            position: 'top',
                            labels: { filter: function(item) { return !item.text.includes('표기용'); } }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if(context.dataset.label.includes('표기용')) return null;
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    label += context.raw + '명';
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11 } } },
                        y: { 
                            stacked: true, 
                            position: 'left', 
                            title: { display: true, text: '누적 지원자 수 (명)', font: {weight: 'bold'} }, 
                            grid: { color: '#f3f4f6' },
                            grace: '15%'
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
